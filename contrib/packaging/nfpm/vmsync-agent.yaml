# vmsync-agent -- the per-hypervisor scheduler and reporter.
#
# The only one of the three packages with a service, a config file and install
# scriptlets, and therefore the only one with opinions about what installing it
# should and should not do. See the scripts/ directory beside this file: it
# installs a unit and does NOT enable it.
name: vmsync-agent
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: none

maintainer: Orsiris de Jong <ozy@netpower.fr>
homepage: https://github.com/netinvent/vmsync
license: GPL-3.0-or-later
vendor: netinvent
section: admin
priority: optional

description: |
  Per-hypervisor agent for vmsync replication.

  Runs in one of three modes, named on the command line and never inferred:
  --standalone (schedule from a local file, no control plane), --monitor
  (report to a control plane and run nothing) or --controlled (the control
  plane holds the schedule and this agent runs it).

  The service is installed but NOT enabled: the agent has no default mode, so
  set VMSYNC_AGENT_MODE in /etc/sysconfig/vmsync-agent (or /etc/default/ on
  Debian) and write /etc/vmsync/agent.json before enabling it. See
  /usr/share/doc/vmsync-agent/.

  Built from ${VMSYNC_FULL_VERSION}.

# It execs vmsync -- that is the entire point of it -- so this is a genuine
# hard dependency rather than a suggestion.
depends:
  - vmsync

contents:
  - src: ${BIN_DIR}/vmsync-agent
    dst: /usr/bin/vmsync-agent
    file_info:
      mode: 0755

  # Generated by build.sh rather than copied from contrib/systemd: the shipped
  # unit names /usr/local/bin, which is the correct path for the hand-install
  # the docs describe and the wrong one for a package that owns /usr/bin.
  - src: ${STAGE_DIR}/vmsync-agent.service
    dst: /usr/lib/systemd/system/vmsync-agent.service
    file_info:
      mode: 0644

  # The mode lives here. Marked noreplace on rpm and registered as a conffile
  # on deb, so an upgrade never silently changes what this host is -- a package
  # that reset VMSYNC_AGENT_MODE would be deciding, on its own, whether a
  # network service may stop this hypervisor's VMs.
  #
  # ${SYSCONFIG_DST} is /etc/sysconfig/vmsync-agent for rpm and
  # /etc/default/vmsync-agent for deb; the unit reads both paths with a leading
  # '-', so whichever exists is picked up and the other is silently absent.
  - src: ${ROOT}/contrib/systemd/vmsync-agent.sysconfig
    dst: ${SYSCONFIG_DST}
    type: config|noreplace
    file_info:
      mode: 0644

  # An EXAMPLE, not a config. The agent cannot be given a working agent.json by
  # a package -- it would have to invent a control-plane URL or a schedule file
  # -- and shipping a placeholder that parses would produce a host that starts
  # and replicates nothing. A missing agent.json is refused loudly at startup,
  # which is the honest state of a freshly installed agent.
  #
  # Note the paths in it are /usr/bin, matching where this package puts the
  # binaries rather than where the hand-install docs put them.
  - src: ${STAGE_DIR}/agent.json.example
    dst: /etc/vmsync/agent.json.example
    file_info:
      mode: 0644

  - src: ${ROOT}/cmd/vmsync-agent/README.md
    dst: /usr/share/doc/vmsync-agent/README.md
    file_info:
      mode: 0644
  - src: ${ROOT}/docs/MODES.md
    dst: /usr/share/doc/vmsync-agent/MODES.md
    file_info:
      mode: 0644
  - src: ${ROOT}/LICENSE
    dst: /usr/share/doc/vmsync-agent/LICENSE
    file_info:
      mode: 0644

  # Created by the package so its mode is right from the start: it holds the
  # SSH key the agent uses to reach target hypervisors and, on a control-plane
  # host, the CA bundle. 0750 root:root rather than 0755.
  - dst: /etc/vmsync
    type: dir
    file_info:
      mode: 0750

scripts:
  postinstall: ${ROOT}/contrib/packaging/scripts/agent-postinstall.sh
  postremove: ${ROOT}/contrib/packaging/scripts/agent-postremove.sh

# One overrides block, holding everything that genuinely differs by packager.
#
# The runtime library names differ because the distro families name them
# differently. preremove differs because the two packagers pass completely
# different arguments, and the question it asks -- "is this a real removal, or
# the teardown half of an upgrade?" -- has to be answered correctly or an
# upgrade stops the agent and never starts it again.
overrides:
  rpm:
    depends:
      - vmsync
      - libvirt-libs
      - libnbd
    scripts:
      preremove: ${ROOT}/contrib/packaging/scripts/agent-preremove-rpm.sh
  deb:
    depends:
      - vmsync
      - libvirt0
      - libnbd0
    scripts:
      preremove: ${ROOT}/contrib/packaging/scripts/agent-preremove-deb.sh
