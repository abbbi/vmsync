# Stage 1 axis definitions. bench.sh computes the FULL cross-product of
# every value across all four [sections] below -- this is not a flat list
# of rows, this file's own default axes multiply
# out to several hundred full+incremental sync pairs, eg:
# number_or_runs = compress * netbuffer * use_ssh * iodepth. In our 
# default config, there would be 14*7*2*3-3=585 runs (3 runs being no-ops,
# where -use-ssh cannot run without compress or netbuffer).Edit any section
# freely; sizes/levels/depths are just text lines, one value per line.
# Whole-line comments (#) and blank lines are ignored; comments after a
# value on the same line are NOT supported, keep them on their own line.
#
# [compress]     one entry per line: "off", or "<algo>:<level>" where algo
#                is s2 (level: default|better|best) or zstd (level: 1-19).
# [netbuffer]    one entry per line: "off", or "<blocksize>,<buffersize>"
#                (vmsync's own -netbuffer=<blocksize>,<buffersize> syntax).
# [use_ssh]      "no" and/or "yes".
# [iodepth]      one -io-depth value per line.
#
# A cell where compress=off AND netbuffer=off AND use_ssh=yes is skipped
# automatically (-use-ssh is a documented no-op without a bridge active --
# see vmsync's own -use-ssh help text -- so that combination would just be
# a second, wasted copy of the plain "vanilla" run).
#
# Every combination gets its own full sync (-reinit) immediately followed
# by one incremental sync, timed separately -- see bench.sh/README.md. With
# the defaults below that is a genuinely large number of complete disk
# copies; trim any section down if that's more than you actually want.

[compress]
off
s2:default
s2:better
s2:best
zstd:1
zstd:3
zstd:5
zstd:7
zstd:9
zstd:11
zstd:13
zstd:15
zstd:17
zstd:19

[netbuffer]
off
64k,256M
128k,512M
128k,1G
256k,1G
64k,2G
256k,2G

[use_ssh]
no
yes

[iodepth]
4
8
16
